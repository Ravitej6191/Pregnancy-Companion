<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8FAB"/>
      <stop offset="100%" stop-color="#F76E8C"/>
    </linearGradient>
    <clipPath id="shape">
      <rect width="100" height="100" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <!-- Same pink rounded square as KSIcon -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Same white heart watermark as KSIcon (30% opacity, same path) -->
  <path clip-path="url(#shape)"
    fill="rgba(255,255,255,0.30)"
    d="M50,82 C27,64 8,51 8,33 C8,19 19,10 31,10 C38,10 44,15 50,23 C56,15 62,10 69,10 C81,10 92,19 92,33 C92,51 73,64 50,82 Z"/>

  <!-- Same bold white KS text as KSIcon (Poppins 900, ~40% of size) -->
  <text
    x="50" y="66"
    text-anchor="middle"
    font-family="'Poppins', 'Arial Black', 'Helvetica Neue', sans-serif"
    font-weight="900"
    font-size="42"
    letter-spacing="-1"
    fill="white">KS</text>
</svg>
